<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="可在手機與電腦同步使用的心智圖 App">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="心智圖">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>心智圖</title>
<style>
:root{--bg:#f3f5f9;--dot:#d3d9e3;--panel:#ffffff;--glass:rgba(255,255,255,.82);--fg:#1f2937;--muted:#6b7280;--line:#e6e9ef;--hover:#eef1f6;--accent:#2563eb;--accent2:#7c3aed;--danger:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.12),0 2px 6px rgba(15,23,42,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--dot:#232a34;--panel:#1a1f26;--glass:rgba(26,31,38,.82);--fg:#e5e7eb;--muted:#9ca3af;--line:#2b323c;--hover:#252c35;--accent:#60a5fa;--accent2:#a78bfa;--danger:#f87171;--shadow:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:2px;padding:0 8px;padding-top:env(safe-area-inset-top);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:10}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding-left:2px}
.logo{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 3px 10px rgba(37,99,235,.35)}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
#title{flex:1;min-width:0;border:0;background:none;font-size:17px;font-weight:700;padding:7px 8px;border-radius:9px;letter-spacing:.2px;text-overflow:ellipsis}
#title:hover{background:var(--hover)}
#title:focus{outline:2px solid var(--accent);background:var(--panel)}
.ib{width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .15s,transform .1s}
.ib:hover{background:var(--hover)}.ib:active{transform:scale(.92)}.ib:disabled{opacity:.28;cursor:default;background:none;transform:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{position:fixed;top:calc(56px + env(safe-area-inset-top));left:0;right:0;bottom:0;touch-action:none;cursor:grab;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px)}
#stage.panning{cursor:grabbing}
#svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.node{cursor:pointer}
.hdl{cursor:pointer;transition:opacity .15s}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:5px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);z-index:10;max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tb{border:0;background:none;border-radius:14px;padding:7px 4px 5px;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:11px;font-weight:500;flex:none;transition:background .15s,transform .1s}
.tb:hover{background:var(--hover)}.tb:active{transform:scale(.93)}.tb:disabled{opacity:.25;cursor:default;background:none;transform:none}
.tb.danger{color:var(--danger)}
.tb svg.i{width:21px;height:21px}
#zoom{position:fixed;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:9;overflow:hidden}
#zoom .ib{border-radius:0;width:40px;height:38px}
#zoom .ib svg.i{width:19px;height:19px}
#zoom span{font-size:10px;text-align:center;color:var(--muted);padding:1px 0 3px;font-variant-numeric:tabular-nums}
#editor{position:fixed;z-index:20;display:none;border:2px solid var(--accent);border-radius:10px;resize:none;overflow:hidden;text-align:center;background:var(--panel);color:var(--fg);line-height:1.3;outline:none;white-space:pre-wrap;word-break:break-word;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none}
.pop.show{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
#menu{top:calc(60px + env(safe-area-inset-top));right:8px;min-width:236px}
#menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px}
#menu button:hover{background:var(--hover)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#menu .ver{font-size:11px;color:var(--muted);padding:4px 12px 2px}
#colorpop{display:none;gap:8px;flex-wrap:wrap;width:262px;padding:10px}
#colorpop.show{display:flex}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;font-size:11px;color:var(--muted);transition:transform .1s}
.sw:hover{transform:scale(1.08)}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
#scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none}
#scrim.show{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--panel);z-index:41;transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top)}
#drawer.open{transform:none}
#drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 10px 18px;font-weight:800;font-size:18px}
#newmap{margin:0 14px 10px;padding:12px;border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;cursor:pointer;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,.3)}
#dlist{flex:1;overflow:auto;padding:2px 10px 16px}
.mi{display:flex;align-items:center;gap:2px;padding:9px 4px 9px 10px;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.mi:hover{background:var(--hover)}.mi.on{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.strip{display:flex;flex-direction:column;gap:2px;margin-right:8px}
.strip i{display:block;width:6px;height:8px;border-radius:3px}
.mt{flex:1;min-width:0}.mt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.mt small{color:var(--muted);font-size:12px}
.mi .ib{width:34px;height:34px;color:var(--muted)}.mi svg.i{width:18px;height:18px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
.ov.sheet{background:rgba(15,23,42,.12);place-items:end center;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .16s ease-out}
.dlg h3{margin:0;padding:18px 20px 6px;font-size:18px}
.db{padding:6px 20px;overflow:auto}
.db p{margin:6px 0 10px;line-height:1.65}
.db ol{margin:4px 0 10px;padding-left:22px;line-height:1.7}
.db code{background:var(--hover);padding:1px 5px;border-radius:5px}
.db textarea,.db input[type=password],.db input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--bg);font-size:14px;line-height:1.5;resize:vertical}
.db img{max-width:100%;border:1px solid var(--line);border-radius:12px;display:block;margin:0 auto}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:650;display:inline-block;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{color:var(--danger)}
.muted{color:var(--muted);font-size:13.5px}
.keys{width:100%;border-collapse:collapse;font-size:14px}
.keys td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
.keys td:first-child{white-space:nowrap;font-weight:650;padding-right:12px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px;background:var(--bg)}
.seg{display:flex;background:var(--hover);border-radius:12px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:8px;max-height:46vh;overflow:auto;padding:3px}
.thc{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 8px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:14px;transition:transform .1s,border-color .15s}
.thc:hover{transform:translateY(-1px)}
.thc.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.thp{display:flex;align-items:center;gap:4px}
.thp i{width:26px;height:16px;border-radius:6px;display:block}
.thp b{width:13px;height:13px;border-radius:50%;display:block}
#ghost{position:fixed;z-index:50;pointer-events:none;background:var(--accent);color:#fff;padding:7px 13px;border-radius:12px;font-size:14px;display:none;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.94;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-6px);background:#1f2937;color:#fff;padding:10px 14px 10px 16px;border-radius:14px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92vw;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
#toast.show{opacity:.97;transform:translateX(-50%)}
#notePanel{position:fixed;right:12px;top:calc(68px + env(safe-area-inset-top));width:330px;max-height:calc(100vh - 190px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);z-index:12;display:none;flex-direction:column;padding:12px 14px 14px;gap:8px}
#notePanel.show{display:flex;animation:pop .15s ease-out}
.np-h{display:flex;align-items:center;gap:8px}
.np-dot{width:12px;height:12px;border-radius:50%;flex:none}
#npTitle{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notePanel .ib{width:34px;height:34px;color:var(--muted)}
#npText{flex:1;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);font-size:15px;line-height:1.6;resize:none;outline:none}
#npText:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.np-meta{font-size:12.5px;color:var(--muted);line-height:1.7;display:flex;gap:14px;flex-wrap:wrap}
.np-meta b{font-weight:600;color:var(--fg)}
@media (max-width:640px){#notePanel{left:8px;right:8px;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom));max-height:46vh}#npText{min-height:110px}}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 10px;cursor:pointer}
.rv{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.rvi{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:9px 12px;cursor:pointer;display:block;width:100%}
.rvi:hover{background:var(--hover)}
.rvi .rvt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.rvi b{font-weight:650}
.rvi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rvi p{margin:5px 0 0;font-size:13.5px;line-height:1.5;color:var(--fg);background:color-mix(in srgb,#f59e0b 12%,transparent);border-radius:9px;padding:6px 9px;white-space:pre-wrap}
@media (max-width:440px){.logo{display:none}.tb{min-width:38px;font-size:10px;padding:6px 1px 4px}#bar{gap:0}#zoom{bottom:calc(84px + env(safe-area-inset-bottom));right:8px}}
#toast button{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;border-radius:9px;padding:5px 11px;cursor:pointer;pointer-events:auto}
</style>
</head>
<body>
<div id="top">
  <button class="ib" id="bDrawer" title="我的心智圖"></button>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M15 12h3M6 12h3M12 9V6M12 15v3"/><circle cx="20" cy="12" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="12" cy="20" r="1.6"/></svg></span><input id="title" maxlength="80" aria-label="中心主題"></div>
  <button class="ib" id="bSync" title="同步"></button>
  <button class="ib" id="bUndo" title="復原 (Ctrl+Z)"></button>
  <button class="ib" id="bRedo" title="重做 (Ctrl+Y)"></button>
  <button class="ib" id="bTheme" title="顏色主題"></button>
  <button class="ib" id="bMore" data-open title="更多"></button>
</div>
<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="zoom"><button class="ib" id="zIn" title="放大"></button><button class="ib" id="zOut" title="縮小"></button><button class="ib" id="zFit" title="全部置中"></button><span id="zPct">100%</span></div>
<div id="bar"></div>
<textarea id="editor" rows="1" spellcheck="false"></textarea>
<div id="menu" class="pop"></div>
<div id="colorpop" class="pop"></div>
<div id="scrim"></div>
<aside id="drawer">
  <header><span>我的心智圖</span><button class="ib" id="bCloseDrawer" title="關閉"></button></header>
  <button id="newmap">＋ 新增心智圖</button>
  <div id="dlist"></div>
</aside>
<aside id="notePanel" data-id=""><div class="np-h"><span class="np-dot"></span><b id="npTitle"></b><button class="ib" id="npClose" title="關閉"></button></div>
<textarea id="npText" placeholder="寫下註記：想法、補充說明、日後的回饋…"></textarea><div class="np-meta" id="npMeta"></div></aside>
<div id="ghost"></div>
<div id="toast"></div>

<script>
'use strict';
const VERSION='v1.4.1';
const $=s=>document.querySelector(s);
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

/* ---------- color themes ---------- */
const THEMES={
  vivid:  {name:'繽紛', root:'#312e81',levels:['#2563eb','#10b981','#f97316','#a855f7','#06b6d4','#ec4899'],branch:['#f43f5e','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899']},
  rainbow:{name:'彩虹', root:'#111827',levels:['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6'],branch:['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899']},
  neon:   {name:'霓虹', root:'#0f0f23',levels:['#ff007f','#00b8ff','#00d26a','#ffab00','#d500f9','#ff3d00']},
  galaxy: {name:'星空', root:'#1e1b4b',levels:['#6366f1','#a855f7','#ec4899','#06b6d4','#8b5cf6','#3b82f6']},
  ocean:  {name:'海洋', root:'#075985',levels:['#0284c7','#06b6d4','#14b8a6','#6366f1','#3b82f6','#0ea5e9']},
  tropical:{name:'熱帶',root:'#0f766e',levels:['#14b8a6','#f97316','#facc15','#ec4899','#22c55e','#06b6d4']},
  mint:   {name:'薄荷', root:'#065f46',levels:['#10b981','#06b6d4','#22c55e','#0ea5e9','#14b8a6','#84cc16']},
  forest: {name:'森林', root:'#14532d',levels:['#16a34a','#84cc16','#f59e0b','#0d9488','#65a30d','#ea580c']},
  sunset: {name:'夕陽', root:'#9a3412',levels:['#f97316','#f43f5e','#f59e0b','#d946ef','#ef4444','#fb923c']},
  autumn: {name:'秋楓', root:'#7c2d12',levels:['#dc2626','#ea580c','#d97706','#be123c','#ca8a04','#b45309']},
  berry:  {name:'莓果', root:'#701a75',levels:['#c026d3','#e11d48','#7c3aed','#db2777','#9333ea','#f43f5e']},
  candy:  {name:'糖果', root:'#db2777',levels:['#f472b6','#a78bfa','#60a5fa','#34d399','#fbbf24','#fb7185']},
  morandi:{name:'莫蘭迪',root:'#57534e',levels:['#6f9a7a','#c08672','#6f87b5','#b8995a','#9a78a8','#5f9f9b']},
  mono:   {name:'簡約', root:'#111827',levels:['#374151','#6b7280','#4b5563','#9ca3af','#1f2937','#6b7280']}
};
const PALETTE=['#e8590c','#1971c2','#2f9e44','#9c36b5','#e03131','#0c8599','#f08c00','#c2255c'];
const UI={
  light:{fg:'#1f2937',nodeFill:'#ffffff',sel:'#2563eb',tint:.14,muted:'#8b95a5',shadow:.13,rootStroke:'none'},
  dark:{fg:'#e5e7eb',nodeFill:'#1a1f26',sel:'#60a5fa',tint:.24,muted:'#7c8796',shadow:.55,rootStroke:'rgba(255,255,255,.22)'}
};
const mq=matchMedia('(prefers-color-scheme: dark)');
const ui=()=>mq.matches?UI.dark:UI.light;
const th=m=>THEMES[(m||map).theme]||THEMES.vivid;
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16);return[n>>16&255,n>>8&255,n&255]}
function mix(h,w,a){const c=hexRgb(h),d=hexRgb(w);return '#'+c.map((v,i)=>Math.round(v+(d[i]-v)*a).toString(16).padStart(2,'0')).join('')}
function textOn(h){const [r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return (.2126*r+.7152*g+.0722*b)>.45?'#1f2937':'#ffffff'}

/* ---------- icons ---------- */
const IC={
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/>',
  fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  zin:'<path d="M12 5v14M5 12h14"/>',zout:'<path d="M5 12h14"/>',
  more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  child:'<rect x="2.5" y="9" width="8" height="6" rx="2"/><path d="M10.5 12h3"/><path d="M18 8.5v7M14.5 12h7"/>',

function blankMap(){return {id:uid(),root:mk('中心主題'),layout:'both',colorMode:'level',theme:defTheme(),updated:Date.now()}}
function san(n,d=0,keep=false){
  if(d>60||!n||typeof n!=='object')return mk('');
  const o={id:keep&&validId(n.id)?n.id:uid(),text:String(n.text??'').slice(0,2000),
    children:Array.isArray(n.children)?n.children.map(c=>san(c,d+1,keep)):[],collapsed:!!n.collapsed,color:isHex(n.color)?n.color:null};
  if(typeof n.note==='string'&&n.note.trim())o.note=n.note.slice(0,10000);
  const ts=v=>{v=Number(v);return v>1e12&&v<4e12?v:null};
  o.created=ts(n.created)||(keep?null:Date.now());if(!o.created)delete o.created;
  if(ts(n.edited))o.edited=ts(n.edited);
  if(n.side==='l'||n.side==='r')o.side=n.side;return o;
}

/* ======================================================================
   SYNC — two backends sharing one merge:
   • claude.ai artifact → private per-person db
   • anywhere else (e.g. GitHub Pages) → a secret GitHub Gist
   ====================================================================== */
const sync={mode:'gist',state:'setup',first:true};
const SYNC_INFO={
  ok:['已同步','#16a34a','cloudOk'],syncing:['同步中…','var(--accent)','cloudSync'],
  offline:['暫時連不上','#d97706','cloudOff'],error:['同步失敗','var(--danger)','cloudOff'],
  setup:['尚未設定同步','var(--muted)','cloudOff'],local:['只存在這台裝置','var(--muted)','cloudOff']
};
function setSync(st){sync.state=st;const b=$('#bSync'),i=SYNC_INFO[st];b.innerHTML=icon(i[2]);b.style.color=i[1];b.title='同步：'+i[0]}
const mapBody=m=>Object.assign({root:JSON.parse(JSON.stringify(m.root,strip)),updated:m.updated||Date.now()},cleanMeta(m));
function fromRemote(id,o){return Object.assign({id,root:san(o.root,0,true),updated:Number(o.updated)||0},cleanMeta(o))}
const newestMap=()=>[...maps].sort((a,b)=>(b.updated||0)-(a.updated||0))[0];

/* merge remote entries [{id,o}] into local; returns ids local must push */
function applyRemote(entries,authoritative){
  let cur=false,list=false;const seen={},push=new Set();
  for(const {id,o} of entries){
    if(!validId(id)||!o||typeof o!=='object')continue;seen[id]=o;
    const ru=Number(o.updated)||0,local=maps.find(m=>m.id===id);
    if(o.deleted){
      deleted[id]=Math.max(deleted[id]||0,ru);
      if(local){if((local.updated||0)<=ru){maps=maps.filter(m=>m!==local);list=true;if(local===map)cur=true}else push.add(id)}
      continue;
    }
    if(!o.root||typeof o.root!=='object')continue;
    if(!local){if((deleted[id]||0)>=ru){push.add(id);continue}delete deleted[id];maps.push(fromRemote(id,o));list=true;continue}
    if(ru>(local.updated||0)){
      if(local===map&&editing){push.add(id);continue}
      Object.assign(local,fromRemote(id,o));delete local.sample;list=true;if(local===map)cur=true;
    }else if((local.updated||0)>ru&&!local.sample)push.add(id);
  }
  if(authoritative){
    if(sync.first){
      sync.first=false;const s=maps.find(m=>m.sample);
      if(s&&Object.values(seen).some(o=>!o.deleted)){maps=maps.filter(m=>m!==s);list=true;if(s===map)cur=true}
    }
    for(const m of maps)if(!m.sample&&!seen[m.id])push.add(m.id);
    for(const id of Object.keys(deleted)){const o=seen[id];if(!o||!o.deleted)push.add(id)}
  }
  if(!maps.length){const b=blankMap();maps.push(b);push.add(b.id);list=true}
  if(cur){if(!maps.includes(map)){map=newestMap();sel=map.root.id}undoS=[];redoS=[];render();fit()}
  if(list){persistLocal();if($('#drawer').classList.contains('open'))renderDrawer()}
  return push;
}
function queueUpload(id){
  if(sync.mode==='claude'){
    if(!db.col)return;const m=maps.find(x=>x.id===id);if(m&&m.sample)return;
    clearTimeout(db.timers[id]);db.timers[id]=setTimeout(()=>dbFlush(id),700);
  }else if(gh.token){clearTimeout(gh.t);gh.t=setTimeout(()=>ghSync(),1500)}
}

/* ---- backend 1: claude.ai db ---- */
const db={col:null,writing:{},dirty:{},timers:{}};
async function dbFlush(id,retried){
  if(!db.col)return;
  if(db.writing[id]){db.dirty[id]=true;return}
  const m=maps.find(x=>x.id===id);if(m&&m.sample)return;
  const body=m?mapBody(m):{deleted:true,updated:deleted[id]||Date.now()};
  db.writing[id]=true;setSync('syncing');let failed=false;
  try{await db.col.doc(id).set(body)}
  catch(e){
    failed=true;const c=e&&e.code;
    if(c==='unavailable'&&!retried){db.writing[id]=false;setTimeout(()=>dbFlush(id,true),800+Math.random()*1500);return}
    if(c==='quota_exceeded')toast('同步空間已滿，請刪除一些不需要的心智圖');
    setSync(c==='unavailable'?'offline':'error');
  }
  db.writing[id]=false;
  if(db.dirty[id]){db.dirty[id]=false;dbFlush(id);return}
  if(!failed&&!Object.values(db.writing).some(Boolean))setSync('ok');
}
async function initDb(){
  setSync('syncing');
  claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
  let d=null,user=null;
  try{[d,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  const id=user&&await user.id().catch(()=>null);
  if(!d||!id){setSync('local');return}
  try{db.col=d.collection('data/users/'+id)}catch(e){setSync('local');return}
  let to=setTimeout(()=>{if(sync.state==='syncing')setSync('offline')},10000);
  db.col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache&&to){clearTimeout(to);to=null}
    const push=applyRemote(snap.docs.map(x=>({id:x.id,o:x.data()})),!snap.metadata.fromCache);
    push.forEach(queueUpload);
    if(!snap.metadata.fromCache&&!push.size&&!Object.values(db.writing).some(Boolean))setSync('ok');
  },err=>{if(to){clearTimeout(to);to=null}setSync(err&&err.code==='unavailable'?'offline':'error')});
}

/* ---- backend 2: GitHub Gist ---- */
const GIST_FILE='mindmap-sync.json';
const gh={token:LS.get('mm.ghToken','')||'',gistId:LS.get('mm.gistId','')||'',login:LS.get('mm.ghLogin','')||'',busy:false,again:false,t:null,last:LS.get('mm.ghLast',0)||0,err:''};
async function ghFetch(path,opt={}){
  const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+(opt.token||gh.token)};
  if(opt.body)h['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function ghFind(){
  for(let page=1;page<=10;page++){
    const list=await ghFetch(`/gists?per_page=100&page=${page}`);
    const g=list.find(x=>x.files&&x.files[GIST_FILE]);
    if(g){gh.gistId=g.id;LS.set('mm.gistId',g.id);return}
    if(list.length<100)break;
  }
  const g=await ghFetch('/gists',{method:'POST',body:JSON.stringify({description:'心智圖 App 同步資料（請勿刪除）',public:false,
    files:{[GIST_FILE]:{content:JSON.stringify({app:'mindmap',version:2,maps:[],deleted:{}})}}})});
  gh.gistId=g.id;LS.set('mm.gistId',g.id);
}
async function ghPull(){
  const g=await ghFetch('/gists/'+gh.gistId),f=g.files&&g.files[GIST_FILE];
  if(!f)return {maps:[],deleted:{}};
  let txt=f.content;
  if(f.truncated&&f.raw_url)txt=await (await fetch(f.raw_url,{cache:'no-store'})).text();
  try{return JSON.parse(txt)||{}}catch(e){return {maps:[],deleted:{}}}
}
function ghEntries(r){
  const out=[];
  for(const m of (Array.isArray(r.maps)?r.maps:[]))if(m&&m.id)out.push({id:String(m.id),o:m});
  for(const [id,t] of Object.entries(r.deleted&&typeof r.deleted==='object'?r.deleted:{}))if(!out.some(e=>e.id===id))out.push({id,o:{deleted:true,updated:Number(t)||0}});
  return out;
}
function ghBuild(){
  const ms=maps.filter(m=>!m.sample).map(m=>Object.assign({id:m.id},mapBody(m)));
  const del={};for(const [id,t] of Object.entries(deleted))if(!ms.some(m=>m.id===id))del[id]=t;
  return {app:'mindmap',version:2,saved:new Date().toISOString(),maps:ms,deleted:del};
}
async function ghSync(manual){
  if(sync.mode!=='gist'||!gh.token)return;
  if(gh.busy){gh.again=true;return}
  gh.busy=true;clearTimeout(gh.t);setSync('syncing');
  try{
    if(!gh.gistId)await ghFind();
    let remote;
    try{remote=await ghPull()}catch(e){if(e.status!==404)throw e;gh.gistId='';LS.set('mm.gistId','');await ghFind();remote=await ghPull()}
    const push=applyRemote(ghEntries(remote),true);
    if(push.size)await ghFetch('/gists/'+gh.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(ghBuild())}}})});
    gh.last=Date.now();LS.set('mm.ghLast',gh.last);gh.err='';setSync('ok');if(manual)toast('已同步');
  }catch(e){
    gh.err=e.status===401?'金鑰無效或已過期，請重新設定。':e.status===403||e.status===429?'GitHub 拒絕存取（金鑰可能沒有勾 gist 權限，或短時間內同步太多次）。':
      navigator.onLine===false?'目前沒有網路，變更會先存在這台裝置。':'連不上 GitHub，變更會先存在這台裝置。';
    setSync(e.status===401||e.status===403?'error':'offline');if(manual)toast(gh.err);
  }finally{gh.busy=false;if(gh.again){gh.again=false;setTimeout(()=>ghSync(),400)}}
}
function initGist(){

}

/* ---------- import ---------- */
function importJSON(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('檔案格式不正確');return false}
  const arr=(o&&Array.isArray(o.maps))?o.maps:Array.isArray(o)?o:[o];
  const ok=arr.filter(m=>m&&m.root&&typeof m.root==='object').map(m=>Object.assign({id:uid(),root:san(m.root),updated:Date.now()},cleanMeta(m)));
  if(!ok.length){toast('找不到心智圖資料');return false}
  maps.push(...ok);ok.forEach(m=>save(m));switchMap(ok[0].id);toast(`已匯入 ${ok.length} 張心智圖`);return true;
}
function parseOutline(txt){
  const items=[];let base=0,stk=[];
  for(const raw of txt.replace(/\r/g,'').split('\n')){
    if(!raw.trim())continue;
    const q=raw.match(/^\s*>\s?(.*)$/);
    if(q){if(items.length){const it=items[items.length-1];it.note=(it.note?it.note+'\n':'')+q[1]}continue}
    const m=raw.match(/^([ \t　]*)(#{1,6}\s+|[-*+•‧·]\s+|\d+[.)、]\s*)?(.*)$/);
    const ind=m[1].replace(/\t/g,'    ').replace(/　/g,'  ').length,mark=m[2]||'';
    const text=m[3].replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').trim();if(!text)continue;
    let lvl;
    if(mark.startsWith('#')){lvl=mark.trim().length-1;base=lvl+1;stk=[]}
    else{while(stk.length&&stk[stk.length-1]>ind)stk.pop();if(!stk.length||stk[stk.length-1]<ind)stk.push(ind);lvl=base+stk.length-1}
    items.push({lvl,text});
  }
  if(!items.length)return null;
  const vroot=mk(''),s2=[vroot];
  for(const it of items){const L=Math.min(it.lvl,s2.length-1),p=s2[L],n=mk(it.text);if(it.note)n.note=it.note;p.children.push(n);s2.length=L+1;s2.push(n)}
  const root=vroot.children.length===1?vroot.children[0]:Object.assign(mk('中心主題'),{children:vroot.children});
  balanceSides(root);return root;
}

/* ---------- pointer: pan / pinch / tap / drag ---------- */
const ptrs=new Map();let lastTap={id:null,t:0};const ghost=$('#ghost');
const rel=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function endDrag(){ghost.style.display='none';if(dropId){dropId=null;render()}}
stage.addEventListener('pointerdown',e=>{
  if(editing)finishEdit();
  if(document.activeElement===titleEl)titleEl.blur();
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,rel(e));
  if(ptrs.size===2){
    if(gest&&gest.type==='drag')endDrag();
    const [a,b]=[...ptrs.values()],c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    gest={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:view.k,wx:(c.x-view.x)/view.k,wy:(c.y-view.y)/view.k};return;
  }
  if(ptrs.size>2)return;
  const ad=e.target.closest('[data-add]'),nt=e.target.closest('[data-note]'),tg=e.target.closest('[data-toggle]'),nd=e.target.closest('[data-id]'),p=rel(e);
  gest={type:ad?'add':nt?'note':tg?'toggle':nd?'node':'pan',id:ad?ad.dataset.add:nt?nt.dataset.note:tg?tg.dataset.toggle:nd?nd.dataset.id:null,sx:p.x,sy:p.y,vx:view.x,vy:view.y,moved:false};
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gest)return;
  const p=rel(e);ptrs.set(e.pointerId,p);
  if(gest.type==='pinch'){
    if(ptrs.size<2)return;const [a,b]=[...ptrs.values()],c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const k=clamp(gest.k*Math.hypot(a.x-b.x,a.y-b.y)/gest.d,.15,3);view={k,x:c.x-gest.wx*k,y:c.y-gest.wy*k};applyView();return;
  }
  const dx=p.x-gest.sx,dy=p.y-gest.sy,far=Math.hypot(dx,dy)>7;
  if(gest.type==='pan'){if(far||gest.moved){gest.moved=true;stage.classList.add('panning');view.x=gest.vx+dx;view.y=gest.vy+dy;applyView()}return}
  if(gest.type==='toggle'||gest.type==='add'||gest.type==='note'){if(far)gest.type='none';return}
  if(gest.type==='node'&&far){
    if(gest.id===map.root.id){gest={...gest,type:'pan',moved:true};return}
    gest.type='drag';const n=byId[gest.id];ghost.textContent=oneLine(n&&n.text)||'（空白）';ghost.style.display='block';
  }
  if(gest.type==='drag'){
    ghost.style.left=(e.clientX+14)+'px';ghost.style.top=(e.clientY+10)+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest&&el.closest('[data-id]');
    const tid=t&&canDrop(gest.id,t.dataset.id)?t.dataset.id:null;
    gest.side=(p.x-view.x)/view.k<map.root._x?'l':'r';
    if(tid!==dropId){dropId=tid;render()}
  }
});
function pointerEnd(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  stage.classList.remove('panning');
  if(!gest)return;
  if(gest.type==='pinch'){if(!ptrs.size)gest=null;return}
  const g=gest;gest=null;
  if(e.type==='pointercancel'){if(g.type==='drag')endDrag();return}
  if(g.type==='pan'&&!g.moved){if(sel){sel=null;render()}}
  else if(g.type==='node'){
    const now=Date.now();
    if(lastTap.id===g.id&&now-lastTap.t<380){lastTap={id:null,t:0};edit(g.id)}
    else{lastTap={id:g.id,t:now};if(sel!==g.id){sel=g.id;render()}}
  }
  else if(g.type==='toggle')toggleCollapse(g.id);
  else if(g.type==='note')openNote(g.id);
  else if(g.type==='add'){if(g.id==='sib')addSibling();else if(g.id==='del')delNode();else addChild(g.id==='l'||g.id==='r'?g.id:undefined)}
  else if(g.type==='drag'){
    const tid=dropId;ghost.style.display='none';dropId=null;
    if(tid&&canDrop(g.id,tid))reparent(g.id,tid,g.side);else render();
  }
}
stage.addEventListener('pointerup',pointerEnd);stage.addEventListener('pointercancel',pointerEnd);
stage.addEventListener('wheel',e=>{e.preventDefault();const p=rel(e);
  const mouseWheel=e.deltaMode!==0||(e.deltaX===0&&Math.abs(e.deltaY)>=50);
  if(e.ctrlKey||e.metaKey||mouseWheel)zoomAt(p.x,p.y,Math.exp(-clamp(e.deltaMode?e.deltaY*33:e.deltaY,-120,120)*(e.ctrlKey?0.01:0.0015)));
  else{view.x-=e.deltaX;view.y-=e.deltaY;applyView()}
},{passive:false});

/* ---------- notes ---------- */
let noteOpen=false,noteUndo=false,noteT;
const npEl=$('#notePanel'),npText=$('#npText');
function openNote(id){
  if(id)sel=id;if(!byId[sel])return;closeMenus();
  noteOpen=true;npEl.dataset.id='';render();npEl.classList.add('show');
  const n=byId[sel],pr=npEl.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(pr.top>sr.top+80&&pr.left<sr.left+40){const by=sr.top+view.y+(n._y+n._h/2)*view.k;if(by>pr.top-16){view.y-=by-(pr.top-16);applyView()}}
  else{const rx=sr.left+view.x+(n._x+n._w/2)*view.k;if(rx>pr.left-16&&pr.left>sr.left+200){view.x-=rx-(pr.left-16);applyView()}}
  if(!byId[sel].note)setTimeout(()=>npText.focus(),60);
}
function closeNote(){if(!noteOpen)return;flushNote();noteOpen=false;npEl.classList.remove('show');npText.blur()}
function fillNote(){
  if(!noteOpen)return;const n=byId[sel];
  if(!n){closeNote();return}
  if(npEl.dataset.id!==n.id){flushNote();npEl.dataset.id=n.id;noteUndo=false;npText.value=n.note||''}
  $('#npTitle').textContent=oneLine(n.text)||'（空白主題）';
  $('.np-dot').style.background=n._col||th().root;
  $('#npMeta').innerHTML=`<span>建立 <b>${fmtFull(n.created)}</b></span><span>修改 <b>${fmtFull(n.edited||n.created)}</b></span>`;
}
function flushNote(){
  if(!noteT)return;clearTimeout(noteT);noteT=null;
  const n=byId[npEl.dataset.id];if(n&&n.note!==undefined&&!n.note.trim())delete n.note;
  save();
}
npText.addEventListener('input',()=>{
  const n=byId[npEl.dataset.id];if(!n)return;
  if(!noteUndo){pushUndo();noteUndo=true}
  n.note=npText.value;n.edited=Date.now();
  clearTimeout(noteT);noteT=setTimeout(()=>{flushNote();render()},600);
});
npText.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeNote()}});
npText.addEventListener('blur',()=>{if(noteT){flushNote();render()}});
$('#npClose').onclick=closeNote;

function goTo(id){
  const n=byId[id];if(!n)return;let x=parentOf[id],opened=false;
  while(x){if(x.collapsed){x.collapsed=false;opened=true}x=parentOf[x.id]}
  sel=id;if(opened)save();render();
  const r=stage.getBoundingClientRect();view.x=r.width/2-n._x*view.k;view.y=(r.height-80)/2-n._y*view.k;applyView();
}
function showReview(){
  let order='new',only=false;const w=document.createElement('div');
  const rows=()=>{
    const all=[];(function walk(n,path){all.push({n,path});n.children.forEach(c=>walk(c,[...path,oneLine(n.text)]))})(map.root,[]);
    return all.filter(x=>!only||x.n.note).sort((a,b)=>order==='new'?(b.n.created||0)-(a.n.created||0):(a.n.created||0)-(b.n.created||0));
  };
  const draw=()=>{
    const items=rows();
    w.innerHTML=`<div class="seg"><button data-ord="new" class="${order==='new'?'on':''}">新 → 舊</button><button data-ord="old" class="${order==='old'?'on':''}">舊 → 新</button></div>
<label class="chk"><input type="checkbox" ${only?'checked':''}> 只看有註記的主題</label>
<div class="rv">${items.map(x=>`<button class="rvi" data-go="${x.n.id}"><span class="rvt">${fmtFull(x.n.created)}</span><b>${esc(oneLine(x.n.text)||'（空白）')}</b>${x.path.length?`<small>${esc(x.path.slice(-2).join(' › '))}</small>`:''}${x.n.note?`<p>${esc(x.n.note.length>160?x.n.note.slice(0,160)+'…':x.n.note)}</p>`:''}</button>`).join('')||'<p class="muted">沒有符合的主題</p>'}</div>`;
  };
  draw();
  let ov;
  w.addEventListener('click',e=>{
    const o=e.target.closest('[data-ord]'),g=e.target.closest('[data-go]');
    if(o){order=o.dataset.ord;draw()}
    if(g){ov._close();goTo(g.dataset.go)}
  });
  w.addEventListener('change',e=>{if(e.target.type==='checkbox'){only=e.target.checked;draw()}});
  ov=dialog({title:'回顧清單：'+(oneLine(map.root.text)||'心智圖'),body:w,buttons:[{label:'複製成文字',onClick:()=>{
    copyText(rows().map(x=>`${fmtFull(x.n.created)}\t${[...x.path,oneLine(x.n.text)].join(' › ')}${x.n.note?'\n    註記：'+x.n.note.replace(/\n/g,'\n          '):''}`).join('\n'));return false}},{label:'關閉',cls:'primary'}]});
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const ov=document.querySelector('.ov');
  if(ov){if(e.key==='Escape')ov._close();return}
  if(editing)return;
  const tag=document.activeElement&&document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;
  const mod=e.ctrlKey||e.metaKey,k=e.key;
  if(mod&&k.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod||e.altKey)return;
  if(k==='Tab'){e.preventDefault();act('child')}
  else if(k==='Enter'){e.preventDefault();act('sib')}
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();act('del')}
  else if(k==='F2'||k===' '){e.preventDefault();act('edit')}
  else if(k==='/'){e.preventDefault();act('fold')}
  else if(k.startsWith('Arrow')){e.preventDefault();nav(k)}
  else if(k==='Escape'){closeMenus();closeDrawer();closeNote()}
});

/* ---------- init ---------- */
mq.addEventListener&&mq.addEventListener('change',render);
addEventListener('resize',()=>applyView());
window.visualViewport&&visualViewport.addEventListener('resize',posEditor);
setSync('setup');
render();fit();
if(firstRun){persistLocal();setTimeout(()=>toast('點一下主題，用藍色 ＋ 新增、紅色 × 刪除'),500)}
setTimeout(initSync,0);

/* ---------- installable app (GitHub Pages): offline + update notice ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!window.claude){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service Worker 註冊失敗:',err));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(hadController)toast('已下載新版本',{label:'重新載入',fn:()=>{finishEdit();persistLocal();setTimeout(()=>location.reload(),300)}});
  });
}
</script>
</body>
</html>
